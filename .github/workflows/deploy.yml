name: Deploy to GitHub Pages

# Деплой статического сайта SCP Terminal на GitHub Pages
on:
  push:
    branches:
      - main
      - claude/scp-website-computer-ui-uku4m2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один параллельный деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем корень репозитория (статический сайт без сборки)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
